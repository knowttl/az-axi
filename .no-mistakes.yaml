# no-mistakes repository configuration
agent: codex
agent_args_override:
  codex:
    - -m
    - gpt-6.1-sol
    - -c
    - model_reasoning_effort="medium"
no_ci: true
commands:
  prepare: 'corepack pnpm install --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false'
  test: 'node scripts/isolated-run.mjs corepack pnpm run build && corepack pnpm test'
  lint: 'corepack pnpm run lint'
document:
  instructions: |
    README.md owns the product introduction, installation and concise usage overview.
    docs/commands.md owns the detailed behavior reference and generated leaf table;
    docs/configuration.md and docs/safety.md own configuration and safety details.
    skills/az-axi/SKILL.md is the packaged agent skill surface and must stay
    consistent with the CLI help and commands; update both together.
    CONTRIBUTING.md owns local validation, benchmarks, live-smoke rules, and releases.
    SECURITY.md owns vulnerability reporting and security testing boundaries.
    Historical design and benchmark notes are preserved on archive/internal-docs;
    they are not behavior specifications. The linked docs and leaf help describe the
    implemented session hooks, Key Vault metadata reads, and Sentinel commands.
    This repository has no AGENTS.md or CLAUDE.md.
review:
  path_instructions:
    - path: "src/lib/**"
      instructions: |
        Credential and secret handling must go through the redaction in
        src/lib/redact.ts. Request classification (read vs query vs secret vs
        destructive vs write) is owned by src/lib/policy.ts, and anything the
        rules do not recognize falls through to write, never to read.
        New Azure actions that return credentials or that destroy or disrupt
        resources must extend SECRET_ACTIONS or DESTRUCTIVE_ACTIONS there.
auto_fix:
  review: 1
  test: 3
  lint: 0
